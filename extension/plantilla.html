<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plantillas · Denuncias RS</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; max-width: 760px; margin: 24px auto; color: #1f2937; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #6b7280; font-size: 13px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #374151; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  textarea { min-height: 130px; line-height: 1.5; }
  .editor { min-height: 130px; line-height: 1.5; overflow-y: auto; }
  .editor:empty:before { content: attr(data-placeholder); color: #9ca3af; }
  .editor:focus { outline: none; border-color: #1d4ed8; }
  .barra_formato { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 6px; }
  .barra_formato .boton.fmt { background: #e5e7eb; color: #111827; min-width: 30px; text-align: center; }
  .barra_formato .boton.fmt:hover { background: #d1d5db; }
  .barra_formato .fmt_neg { font-weight: 800; }
  .barra_formato .fmt_cur { font-style: italic; }
  .barra_formato .fmt_sub { text-decoration: underline; }
  .barra_formato label.color_lbl { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 11px; color: #374151; text-transform: none; letter-spacing: 0; }
  .barra_formato input[type="color"] { width: 30px; height: 26px; padding: 1px; border-radius: 6px; cursor: pointer; }
  .barra { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .boton { padding: 8px 14px; border: 0; border-radius: 7px; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
  .boton.sec { background: #e5e7eb; color: #111827; }
  .boton.del { background: #ef4444; padding: 4px 10px; }
  .boton.mini { padding: 4px 10px; font-size: 12px; }
  #aviso { color: #065f46; font-size: 13px; margin-left: auto; }
  h2 { font-size: 14px; margin: 22px 0 8px; border-bottom: 2px solid #1d4ed8; padding-bottom: 4px; }
  .item { border: 1px solid #e5e7eb; border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; }
  .item .tit { font-weight: 700; color: #111827; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .item .tit .nombre_plantilla_lista { overflow-wrap: anywhere; }
  .item .txt { white-space: pre-wrap; font-size: 13px; color: #374151; margin: 6px 0; max-height: 120px; overflow: auto; background: #f8fafc; padding: 8px; border-radius: 6px; }
  .item .acc { display: flex; flex-wrap: wrap; gap: 8px; }
  .vacio { color: #6b7280; font-size: 13px; }
  .chip_etiqueta { display: inline-block; background: #e0e7ff; color: #1d4ed8; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
  .insignia_marca_plantilla { display: inline-block; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; max-width: 100%; overflow-wrap: anywhere; }
  .insignia_marca_plantilla.sin_marca_plantilla { color: #6b7280; font-style: italic; }
  .contador_plantillas_lista { color: #6b7280; font-size: 12px; margin: 0 0 8px; }
  #filtro_tema { margin-bottom: 12px; }
  #tema_nuevo { margin-top: 6px; }
</style>
</head>
<body>
  <h1>Plantillas</h1>
  <p class="sub">Crea y guarda textos que reutilizas en las denuncias (datos, descripciones, motivos…). Se guardan en este navegador.</p>

  <label for="tema_sel">Tema</label>
  <select id="tema_sel"></select>
  <input id="tema_nuevo" placeholder="Escribe el nombre del tema nuevo" style="display:none;">

  <label for="etiqueta">Etiqueta</label>
  <input id="etiqueta" placeholder="Ej. Motivo de suplantación">

  <label for="nombre">Nombre de la plantilla</label>
  <input id="nombre" placeholder="Ej. Motivo estándar de suplantación">

  <label for="texto">Información de la plantilla</label>
  <div class="barra_formato" id="barra_formato">
    <button type="button" class="boton mini fmt fmt_neg" id="fmt_negrita" title="Negrita">N</button>
    <button type="button" class="boton mini fmt fmt_cur" id="fmt_cursiva" title="Cursiva">C</button>
    <button type="button" class="boton mini fmt fmt_sub" id="fmt_subrayado" title="Subrayado">S</button>
    <label class="color_lbl">Color <input type="color" id="color_texto" value="#111827" title="Color de texto"></label>
    <button type="button" class="boton mini fmt" id="fmt_quitar" title="Quitar formato">Quitar formato</button>
  </div>
  <div id="texto" contenteditable="true" class="editor" data-placeholder="Escribe aquí el texto que quieras reutilizar…"></div>

  <div class="barra">
    <button class="boton" id="guardar">Guardar plantilla</button>
    <button class="boton sec" id="limpiar">Limpiar</button>
    <span id="aviso"></span>
  </div>

  <h2>Plantillas guardadas</h2>
  <label for="filtro_tema">Filtrar por marca</label>
  <select id="filtro_tema"></select>
  <p id="contador_plantillas" class="contador_plantillas_lista" aria-live="polite"></p>
  <div id="lista"></div>

  <script src="datos/marcas.js"></script>
  <script src="plantilla.js"></script>
</body>
</html>
