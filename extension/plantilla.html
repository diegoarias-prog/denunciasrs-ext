<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plantillas · Denuncias RS</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; max-width: 760px; margin: 24px auto; color: #1f2937; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #6b7280; font-size: 13px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #374151; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  textarea { min-height: 130px; line-height: 1.5; }
  .barra { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .boton { padding: 8px 14px; border: 0; border-radius: 7px; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
  .boton.sec { background: #e5e7eb; color: #111827; }
  .boton.del { background: #ef4444; padding: 4px 10px; }
  .boton.mini { padding: 4px 10px; font-size: 12px; }
  #aviso { color: #065f46; font-size: 13px; margin-left: auto; }
  h2 { font-size: 14px; margin: 22px 0 8px; border-bottom: 2px solid #1d4ed8; padding-bottom: 4px; }
  .item { border: 1px solid #e5e7eb; border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; }
  .item .tit { font-weight: 700; color: #111827; }
  .item .txt { white-space: pre-wrap; font-size: 13px; color: #374151; margin: 6px 0; max-height: 120px; overflow: auto; background: #f8fafc; padding: 8px; border-radius: 6px; }
  .item .acc { display: flex; gap: 8px; }
  .vacio { color: #6b7280; font-size: 13px; }
  .grupo_tema { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #1d4ed8; width: 100%; text-align: left; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; margin: 10px 0 4px; padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
  .grupo_tema:hover { background: #e0e7ff; }
  .grupo_tema .flecha { font-size: 11px; }
  .grupo_tema .conteo { font-weight: 600; color: #6366f1; text-transform: none; letter-spacing: 0; }
  .grupo_cuerpo { margin: 0 0 8px; }
  .chip_etiqueta { display: inline-block; background: #e0e7ff; color: #1d4ed8; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  #filtro_tema { margin-bottom: 12px; }
  #tema_nuevo { margin-top: 6px; }
</style>
</head>
<body>
  <h1>Plantillas</h1>
  <p class="sub">Crea y guarda textos que reutilizas en las denuncias (datos, descripciones, motivos…). Se guardan en este navegador.</p>

  <label for="tema_sel">Tema</label>
  <select id="tema_sel"></select>
  <input id="tema_nuevo" placeholder="Escribe el nombre del tema nuevo" style="display:none;">

  <label for="etiqueta">Etiqueta</label>
  <input id="etiqueta" placeholder="Ej. Motivo de suplantación">

  <label for="nombre">Nombre de la plantilla</label>
  <input id="nombre" placeholder="Ej. Motivo estándar de suplantación">

  <label for="texto">Información de la plantilla</label>
  <textarea id="texto" placeholder="Escribe aquí el texto que quieras reutilizar…"></textarea>

  <div class="barra">
    <button class="boton" id="guardar">Guardar plantilla</button>
    <button class="boton sec" id="limpiar">Limpiar</button>
    <span id="aviso"></span>
  </div>

  <h2>Plantillas guardadas</h2>
  <label for="filtro_tema">Filtrar por tema</label>
  <select id="filtro_tema"></select>
  <div id="lista"></div>

  <script src="datos/marcas.js"></script>
  <script src="plantilla.js"></script>
</body>
</html>
